name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push'
    environment: runtime-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925
        with:
          version: 2026.8.12
          install: true
          cache: false
      - name: Mint a read-only runtime download token
        id: runtime-reader
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.CORE_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READER_APP_PRIVATE_KEY }}
          owner: softmax-universe
          repositories: scott-demo-environments
          permission-contents: read
      - run: pnpm run setup
        env:
          GH_TOKEN: ${{ steps.runtime-reader.outputs.token }}
      - run: pnpm check
