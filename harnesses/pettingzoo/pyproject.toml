[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reversi-softmax-pettingzoo"
version = "0.4.1"
description = "PettingZoo AEC stepping over the authoritative Reversi runtime."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
  "pettingzoo==1.27.0",
  "gymnasium==1.4.0",
  "numpy==2.5.4",
  "softmax-universe-client==0.7.0a2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
softmax-universe-client = { path = "../../.local/runtime-packages/softmax_universe_client-0.7.0a2-py3-none-any.whl" }
