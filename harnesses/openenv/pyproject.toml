[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reversi-softmax-openenv"
version = "0.1.0"
description = "OpenEnv direct stepping over the local Reversi runtime."
requires-python = ">=3.12"
dependencies = ["openenv==0.12.0"]

[project.scripts]
reversi-openenv = "reversi_openenv.server:main"

[tool.setuptools.packages.find]
where = ["src"]
