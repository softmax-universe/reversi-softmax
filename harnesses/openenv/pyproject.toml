[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reversi-softmax-openenv"
version = "0.4.1"
description = "OpenEnv direct stepping over the local Reversi runtime."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["openenv==0.12.0", "softmax-universe-client==0.7.0a2"]

[project.scripts]
reversi-openenv = "reversi_openenv.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
softmax-universe-client = { path = "../../.local/runtime-packages/softmax_universe_client-0.7.0a2-py3-none-any.whl" }
